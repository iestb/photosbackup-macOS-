name: PhotosBackup

options:
  bundleIdPrefix: com.g8row.photosbackup
  deploymentTarget:
    iOS: "15.0"
    macOS: "13.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    MARKETING_VERSION: "0.3.5"
    CURRENT_PROJECT_VERSION: "13"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    # No fixed team here on purpose: whoever builds this picks their own team
    # in Xcode's Signing & Capabilities once, and Automatic signing remembers
    # it per target. A hardcoded team ID would just get reset to someone
    # else's on every `xcodegen generate`.
    CODE_SIGN_STYLE: Automatic

targets:
  PhotosBackup:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: GPMC/Core
      - path: App/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: App/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.g8row.photosbackup
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
  PhotosBackupTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PhotosBackupTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.g8row.photosbackup.tests
    dependencies:
      - target: PhotosBackup
  PhotosBackupMac:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: GPMC/Core
      - path: App/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: App/Resources/Info-macOS.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.g8row.photosbackup
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Resources/PhotosBackupMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

schemes:
  PhotosBackup:
    build:
      targets:
        PhotosBackup: all
        PhotosBackupTests: [test]
    test:
      targets:
        - PhotosBackupTests
  PhotosBackupMac:
    build:
      targets:
        PhotosBackupMac: all
